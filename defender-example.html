 */function Jm(l){return N.createElement(cm,{flushSync:Gm.flushSync,...l})}const Zm={axes:[{label:"Openness",positive:"More open",negative:"Closed / tribal"},{label:"Ontology",positive:"Fluid / subjective",negative:"Deterministic / hierarchical"},{label:"Play vs Seriousness",positive:"Playful / ironic",negative:"Earnest / serious"},{label:"Combative vs Collaborative",positive:"Collaborative / dialogical",negative:"Combative / adversarial"},{label:"Depth vs Surface",positive:"Philosophical / deep",negative:"Dismissive / surface-level"},{label:"Personal vs Abstract",positive:"Personal / relational",negative:"Abstract / impersonal"}],data:[{id:"T1",author:"Defender",emoji:"🪧",text:"you can be the first person on twitter to articulate this",estimation:"Framing tweet, inviting articulation of a cooperative ontology of life.",coords:[65,40,-40,70,50,-80],replies_to:null},{id:"T2",author:"Mallon Khan",emoji:"😏",text:"Good news: [image depicting no results for twitter search 'my butt has a face']",estimation:"Deflating with absurd humor, treating the discussion as unserious.",coords:[-40,20,90,-50,-80,-70],replies_to:"T1"},{id:"T3",author:"Defender",emoji:"🤔",text:"not sure what you mean! can you elaborate please?",estimation:"Open inquiry, assuming good faith, pulling humor back into dialogue.",coords:[70,35,-60,80,40,-60],replies_to:"T2"},{id:"T4",author:"Mallon Khan",emoji:"🙃",text:"It was a dumb joke to imply you can make inane statements too.",estimation:"Acknowledges joke, meta-commentary on seriousness of discussion.",coords:[-20,30,40,-30,-50,-20],replies_to:"T3"},{id:"T5",author:"Defender",emoji:"🧑‍🏫",text:"oh i see! why do you think it's dumb? floogy posted some useful critical feedback here, but I think there are rebuttals across the replies here. Would appreciate if you see one unaddressed & would like to share it 🙏",estimation:"Engages respectfully, treating Mallon as a potential contributor despite humor.",coords:[85,40,-50,85,55,-50],replies_to:"T4"},{id:"T6",author:"Mallon Khan",emoji:"🌀",text:"Not my game. Not worth debating bc of how vague it is. My rebuttal is my joke, my poetic form of compression and recursion.",estimation:"Withdraws from serious debate, reframing humor as artistic resistance.",coords:[-25,45,70,-20,-40,-10],replies_to:"T5"},{id:"T7",author:"Defender",emoji:"🙏",text:"got it, thank you!! (your replies do affect my world model more than most, so I will always try to poke to see what I can learn)",estimation:"Expresses gratitude, reinforcing openness even after refusal.",coords:[90,50,-30,95,45,40],replies_to:"T6"},{id:"T8",author:"Mallon Khan",emoji:"🤡❤️",text:"And my reply was dumb because you take what you do seriously and I am just being a silly troll. I do appreciate you and the work you do.",estimation:"Disarms tension with humility and affection, reframing his role as playful.",coords:[20,45,60,40,10,70],replies_to:"T7"},{id:"T10",author:"floogy",emoji:"⚔️",text:"If you want to be wrong. Life is that which can move against the path of least resistence. That cooperation requires life does not mean life = cooperation. Not even a category error, plain wrong. Most living beings MUST  NOT cooperate with, but must kill other life to survive",estimation:"Strong, combative rebuttal. Defends deterministic view of survival and competition.",coords:[-80,-85,-70,-90,-60,-85],replies_to:"T1"},{id:"T11",author:"Defender",emoji:"🧩",text:'"living beings must kill other life to survive" -> if there is no other life to kill, does life die?',estimation:"Philosophical counter-question, probing contradiction in floogy’s stance.",coords:[60,-20,-50,70,60,-60],replies_to:"T10"},{id:"T12",author:"Defender",emoji:"📐",text:`here's another that I believe in theorem - I am relying on you to tell me why it's wrong: "life that cooperates successfully ALWAYS outcompetes life that fails to cooperate" (because it has more resources). Life that cooperates unsuccessfully, of course just dies`,estimation:"Formalizes his cooperat
